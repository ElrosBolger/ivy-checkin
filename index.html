<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ivy Central Apartment - Self Check-in Guide</title>
  <style>
    :root {
      --primary: #1b4d3e;
      --primary-light: #2d6a4f;
      --accent-gold: #c2882f;
      --accent-blue: #1e3d59;
      --danger: #dc2626;
      --bg: #f9f7f2;
      --card-bg: #ffffff;
      --text: #2d3748;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 18px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 10px 25px rgba(0,0,0,0.07);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    /* Top Bar */
    .header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.5px;
    }
    .brand-text p {
      font-size: 11px;
      color: var(--accent-gold);
      font-weight: 600;
      text-transform: uppercase;
    }
    .lang-btn-current {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* Progress */
    .progress-bar-container {
      width: 100%;
      height: 5px;
      background: #e2e8f0;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-gold), var(--primary));
      width: 20%;
      transition: width 0.35s ease;
    }
    /* Content */
    .step-content {
      padding: 20px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      width: fit-content;
      margin-bottom: 10px;
      border: 1px solid #a7f3d0;
    }
    .step-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .step-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }
    /* Image Boxes */
    .visual-box {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      position: relative;
      background: #f8fafc;
    }
    .visual-box img {
      width: 100%;
      display: block;
      object-fit: cover;
    }
    /* Detail Image Annotations */
    .annotation-box {
      position: absolute;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .anno-solar {
      top: 46%;
      left: 52%;
      width: 17%;
      height: 7%;
      border: 2px dashed #ef4444;
      background: rgba(239, 68, 68, 0.25);
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .anno-keybox {
      top: 52.5%;
      left: 75%;
      width: 13%;
      height: 7%;
      border: 3px solid #22c55e;
      background: rgba(34, 197, 94, 0.25);
      color: #fff;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.8);
      animation: pulse 1.6s infinite;
    }
    /* Callout & Warning */
    .alert-box {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 16px;
    }
    .alert-danger {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .alert-info {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    .alert-icon {
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
    }
    /* Key Code Display */
    .code-display-card {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      margin: 12px 0 16px 0;
      position: relative;
    }
    .code-blurred {
      filter: blur(8px);
      user-select: none;
      transition: filter 0.25s ease;
    }
    .code-revealed {
      filter: blur(0);
      user-select: all;
    }
    .toggle-code-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      background: #e2e8f0;
      color: #334155;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
    }
    .code-label {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .code-value {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 10px;
      color: var(--primary);
      font-family: monospace;
    }
    /* WhatsApp Button in Final Step */
    .whatsapp-card {
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-top: 10px;
    }
    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #25d366;
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 20px;
      border-radius: 25px;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
      transition: transform 0.2s;
    }
    .whatsapp-btn:active {
      transform: scale(0.97);
    }
    /* Buttons */
    .nav-actions {
      display: flex;
      gap: 12px;
      margin-top: auto;
      padding-top: 14px;
    }
    .btn {
      flex: 1;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-prev {
      background: #f1f5f9;
      color: #475569;
      flex: 0 0 80px;
    }
    .btn-next {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(27,77,62,0.3);
    }
    .btn:active {
      transform: scale(0.98);
    }
    /* Language Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.hidden {
      display: none;
    }
    .modal-card {
      background: white;
      width: 100%;
      max-width: 380px;
      border-radius: 24px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    .modal-logo {
      width: 68px;
      height: 68px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .modal-card h2 {
      font-size: 19px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .modal-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .lang-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .lang-tile {
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 14px 10px;
      background: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .lang-tile:hover, .lang-tile:active {
      border-color: var(--primary);
      background: #f0fdf4;
      transform: translateY(-2px);
    }
    .lang-flag {
      font-size: 32px;
    }
    .lang-name {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
    }
    .step-img-overlay {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.88);
      color: white;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
    }
    .pinpoint-box {
      position: absolute;
      border: 3px solid #22c55e;
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

            class Synth {
                constructor() {
                    this.nodes = [];
                }
                play(type, freq, time, dur) {
                    this.nodes.push(new SynthNode(type, freq, time, dur));
                }
                removeNode(node) {
                    this.nodes = this.nodes.filter(n => n !== node);
                }
                trigger(seq, time) {
                    seq.forEach((note, idx) => {
                        if (note) {
                            this.play('triangle', noteToFreq(note), time + idx * 0.15, 0.1);
                            this.play('sine', noteToFreq(note)*0.5, time + idx * 0.15, 0.1);
                        }
                    });
                }
            }

            const synth = new Synth();

            function noteToFreq(note) {
                const notes = { 'C': 0, 'D': 2, 'E': 4, 'F': 5, 'G': 7, 'A': 9, 'B': 11 };
                let match = note.match(/([A-G])([#b])?([0-9])/);
                if(!match) return 440;
                let semitone = notes[match[1]];
                if (match[2] === '#') semitone++;
                if (match[2] === 'b') semitone--;
                let octave = parseInt(match[3]);
                return 440 * Math.pow(2, (semitone - 9 + (octave - 4) * 12) / 12);
            }

            // --- JELLYFISH CREATURE ---
            class Jellyfish {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.vy = (Math.random() - 0.5) * 1.5 - 0.5;
                    this.size = 30 + Math.random() * 40;
                    this.color = Math.random() < 0.2 ? '#ff77aa' : (Math.random() < 0.5 ? '#77ffcc' : '#77ccff');
                    this.pulse = Math.random() * Math.PI * 2;
                    this.tentacles = [];
                    for (let i = 0; i < 6; i++) {
                        this.tentacles.push({
                            length: 50 + Math.random() * 80,
                            offset: i * 0.5
                        });
                    }
                    this.dead = false;
                }
                update() {
                    this.pulse += 0.05;
                    let currentSize = this.size + Math.sin(this.pulse) * 5;
                    
                    this.x += this.vx + Math.sin(this.pulse * 0.5) * 0.5;
                    this.y += this.vy;
                    
                    // buoyancy
                    this.vy -= 0.02;
                    if(this.vy < -1.5) this.vy = -1.5;

                    // Boundaries
                    if (this.x < 50 || this.x > width - 50) this.vx *= -1;
                    if (this.y < 50) this.vy = 1;

                    // Collide with net
                    if (net.active && gameState === 'play') {
                        let d = Math.hypot(this.x - net.x, this.y - net.y);
                        if (d < net.radius + currentSize*0.5) {
                            // Caught!
                            score += Math.floor(this.size);
                            playSound('catch');
                            synth.trigger(['C5', 'E5', 'G5'], ctx.currentTime);
                            particles.push(new ScorePopup(this.x, this.y, `+${Math.floor(this.size)}`));
                            for(let i=0; i<15; i++) particles.push(new Bubble(this.x, this.y, this.color));
                            this.dead = true;
                        }
                    }
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    let currentSize = this.size + Math.sin(this.pulse) * 5;

                    // Draw Tentacles
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 2;
                    this.tentacles.forEach((t, idx) => {
                        ctx.beginPath();
                        ctx.moveTo((idx - 3) * (currentSize * 0.2), currentSize * 0.3);
                        let segments = 5;
                        for(let s = 1; s <= segments; s++) {
                            let sy = (currentSize * 0.3) + (t.length / segments) * s;
                            let sx = (idx - 3) * (currentSize * 0.2) + Math.sin(this.pulse * 2 + t.offset + s) * 15;
                            ctx.lineTo(sx, sy);
                        }
                        ctx.stroke();
                    });

                    // Draw Bell
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = 0.6;
                    ctx.beginPath();
                    ctx.arc(0, 0, currentSize, Math.PI, 0, false);
                    ctx.lineTo(currentSize, currentSize * 0.3);
                    // wavy bottom
                    ctx.quadraticCurveTo(0, currentSize * 0.4, -currentSize, currentSize * 0.3);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // Inner glow
                    let grad = ctx.createRadialGradient(0, -currentSize*0.2, 2, 0, 0, currentSize);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(1, 'transparent');
                    ctx.fillStyle = grad;
                    ctx.globalAlpha = 0.4;
                    ctx.fill();

                    ctx.restore();
                }
            }

            // --- PARTICLES & EFFECTS ---
            class Bubble {
                constructor(x, y, color = 'rgba(255,255,255,0.6)') {
                    this.x = x;
                    this.y = y;
                    this.vx = (Math.random() - 0.5) * 1;
                    this.vy = -Math.random() * 2 - 1;
                    this.radius = Math.random() * 6 + 2;
                    this.color = color;
                    this.alpha = 1;
                    this.dead = false;
                }
                update() {
                    this.x += this.vx + Math.sin(this.y * 0.05) * 0.5;
                    this.y += this.vy;
                    this.alpha -= 0.005;
                    if (this.alpha <= 0 || this.y < 0) this.dead = true;
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, this.alpha);
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fill();
                    ctx.restore();
                }
            }

            class ScorePopup {
                constructor(x, y, text) {
                    this.x = x;
                    this.y = y;
                    this.text = text;
                    this.alpha = 1;
                    this.vy = -1;
                    this.dead = false;
                }
                update() {
                    this.y += this.vy;
                    this.alpha -= 0.02;
                    if(this.alpha <= 0) this.dead = true;
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, this.alpha);
                    ctx.fillStyle = '#ffff55';
                    ctx.font = 'bold 20px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(this.text, this.x, this.y);
                    ctx.restore();
                }
            }

            // --- NET / PLAYER ---
            const net = {
                x: width / 2,
                y: height / 2,
                radius: 40,
                active: false,
                alpha: 0
            };

            // --- GAME VARIABLES ---
            let jellies = [];
            let particles = [];
            let score = 0;
            let timeRemaining = 60;
            let gameState = 'title'; // 'title', 'play', 'gameover'
            let spawnTimer = 0;
            let lastTime = 0;
            let timerInterval = null;

            // --- INPUT HANDLING ---
            function handlePointerMove(e) {
                const rect = canvas.getBoundingClientRect();
                net.x = e.clientX - rect.left;
                net.y = e.clientY - rect.top;
            }

            function handlePointerDown(e) {
                if (gameState === 'play') {
                    net.active = true;
                    net.alpha = 1;
                    playSound('net');
                    synth.trigger(['A4', 'C5'], ctx.currentTime);
                    for(let i=0; i<8; i++) {
                        particles.push(new Bubble(net.x, net.y, '#77ffff'));
                    }
                } else if (gameState === 'title') {
                    startGame();
                } else if (gameState === 'gameover') {
                    gameState = 'title';
                }
            }

            function handlePointerUp(e) {
                net.active = false;
            }

            window.addEventListener('mousemove', handlePointerMove);
            window.addEventListener('mousedown', handlePointerDown);
            window.addEventListener('mouseup', handlePointerUp);

            window.addEventListener('touchmove', (e) => {
                if(e.touches.length > 0) handlePointerMove(e.touches[0]);
            }, {passive: true});
            window.addEventListener('touchstart', (e) => {
                if(e.touches.length > 0) handlePointerDown(e.touches[0]);
            }, {passive: true});
            window.addEventListener('touchend', handlePointerUp);


            // --- GAME FLOW ---
            function startGame() {
                score = 0;
                timeRemaining = 60;
                jellies = [];
                particles = [];
                gameState = 'play';
                
                // Initial spawn
                for(let i=0; i<5; i++) {
                    jellies.push(new Jellyfish(Math.random()*(width-100)+50, Math.random()*(height-200)+150));
                }

                if(timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    if(gameState === 'play') {
                        timeRemaining--;
                        if(timeRemaining <= 0) {
                            gameOver();
                        }
                    }
                }, 1000);
            }

            function gameOver() {
                gameState = 'gameover';
                clearInterval(timerInterval);
                playSound('gameover');
            }


            // --- MAIN LOOP ---
            function loop(timestamp) {
                let dt = timestamp - lastTime;
                lastTime = timestamp;

                // Update
                if (gameState === 'play') {
                    spawnTimer++;
                    if (spawnTimer > 40 && jellies.length < 15) {
                        jellies.push(new Jellyfish(Math.random() * (width - 100) + 50, height + 50));
                        spawnTimer = 0;
                    }

                    // Ambient bubbles
                    if(Math.random() < 0.2) {
                        particles.push(new Bubble(Math.random() * width, height + 10));
                    }

                    jellies.forEach(j => j.update());
                    jellies = jellies.filter(j => !j.dead);

                    if(net.active) {
                        net.alpha = Math.min(1, net.alpha + 0.1);
                    } else {
                        net.alpha = Math.max(0, net.alpha - 0.05);
                    }
                }

                particles.forEach(p => p.update());
                particles = particles.filter(p => !p.dead);


                // Draw Background (Deep Ocean Gradient)
                let grad = ctx.createLinearGradient(0, 0, 0, height);
                grad.addColorStop(0, '#020b1c');
                grad.addColorStop(0.5, '#052247');
                grad.addColorStop(1, '#083c6f');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);

                // Draw rays of light from surface
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.beginPath();
                ctx.moveTo(width * 0.2, 0);
                ctx.lineTo(width * 0.1, height);
                ctx.lineTo(width * 0.3, height);
                ctx.lineTo(width * 0.5, 0);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(width * 0.7, 0);
                ctx.lineTo(width * 0.6, height);
                ctx.lineTo(width * 0.8, height);
                ctx.lineTo(width * 0.9, 0);
                ctx.fill();
                ctx.restore();


                // Draw Entities
                particles.forEach(p => p.draw());
                jellies.forEach(j => j.draw());

                // Draw Net / Cursor interaction
                if (gameState === 'play' && net.alpha > 0) {
                    ctx.save();
                    ctx.translate(net.x, net.y);
                    ctx.globalAlpha = net.alpha * 0.7;
                    ctx.strokeStyle = '#77ffff';
                    ctx.fillStyle = 'rgba(119, 255, 255, 0.15)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    // Draw glowing net ring
                    ctx.arc(0, 0, net.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    // Net mesh pattern inside
                    ctx.beginPath();
                    ctx.moveTo(-net.radius*0.7, 0); ctx.lineTo(net.radius*0.7, 0);
                    ctx.moveTo(0, -net.radius*0.7); ctx.lineTo(0, net.radius*0.7);
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
                    ctx.stroke();

                    ctx.restore();
                }

                // Draw UI / HUD
                if (gameState === 'play') {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 24px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillText(`Score: ${score}`, 20, 40);

                    ctx.textAlign = 'right';
                    ctx.fillText(`Time: ${timeRemaining}s`, width - 20, 40);
                } else if (gameState === 'title') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                    ctx.fillRect(0, 0, width, height);

                    ctx.fillStyle = '#77ffff';
                    ctx.font = 'bold 48px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('JELLYFISH DANCE', width / 2, height / 2 - 50);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '20px sans-serif';
                    ctx.fillText('Catch the glowing jellies with your net!', width / 2, height / 2);

                    ctx.fillStyle = '#ff77aa';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.fillText('Click or Tap anywhere to Start', width / 2, height / 2 + 60);
                } else if (gameState === 'gameover') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(0, 0, width, height);

                    ctx.fillStyle = '#ff77aa';
                    ctx.font = 'bold 48px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('TIME UP!', width / 2, height / 2 - 60);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '28px sans-serif';
                    ctx.fillText(`Final Score: ${score}`, width / 2, height / 2);

                    ctx.fillStyle = '#77ffff';
                    ctx.font = 'bold 20px sans-serif';
                    ctx.fillText('Click to Play Again', width / 2, height / 2 + 60);
                }

                requestAnimationFrame(loop);
            }

            requestAnimationFrame(loop);
